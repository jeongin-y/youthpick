<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유스픽 · 목표 시뮬레이션</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="src/ui/styles.css" rel="stylesheet">
<script type="module" src="src/ui/app.js"></script>
</head>
<body>

<header>
  <a class="logo" href="index.html">유스픽</a>
  <nav>
    <a href="#step-1" data-tab="simulator">시뮬레이션</a>
    <a href="#calendar" data-tab="calendar">캘린더</a>
  </nav>
</header>

<main id="main">
  <p id="sample-notice" class="notice" hidden>지금 보이는 혜택은 <b>테스트용 가상 데이터</b>예요. 실제 정책이 아니에요.</p>

  <section data-view="simulator">
    <ol id="progress">
      <li data-n="1">목표</li>
      <li data-n="2">내 상태</li>
      <li data-n="3">혜택 확인</li>
      <li data-n="4">비교</li>
    </ol>

    <form id="sim-form" novalidate>
      <div data-step="1">
        <h1>얼마를 모으고 싶어요?</h1>
        <button type="button" class="link" id="persona">예시 채우기: 자취하는 대학생 A</button>
        <label class="field">목표 금액
          <span class="unit"><input name="goal" inputmode="decimal" placeholder="1000" autocomplete="off">만원</span>
        </label>
        <label class="field">월 저축 가능액
          <span class="unit"><input name="saving" inputmode="decimal" placeholder="20" autocomplete="off">만원</span>
        </label>
        <div id="base-result" class="result" aria-live="polite"></div>
        <div class="actions"><button type="submit" class="primary" id="to-step-2">내 상태 입력하기</button></div>
      </div>

      <div data-step="2" hidden>
        <h1>지금 상태를 알려주세요</h1>
        <p class="muted">입력한 값은 이 화면에서만 쓰고 어디에도 보내지 않아요. 비워 두면 "확인 필요"로 표시해요.</p>
        <label class="field">만 나이
          <span class="unit"><input name="age" type="number" inputmode="numeric" min="0" max="100">세</span>
        </label>
        <label class="field">거주 지역
          <select name="region">
            <option value="">선택 안 함</option>
            <option>서울</option><option>부산</option><option>대구</option><option>인천</option>
            <option>광주</option><option>대전</option><option>울산</option><option>세종</option>
            <option>경기</option><option>강원</option><option>충북</option><option>충남</option>
            <option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option>
          </select>
        </label>
        <label class="field">신분
          <select name="status">
            <option value="">선택 안 함</option>
            <option value="student">대학생</option>
            <option value="jobseeker">취업 준비생</option>
            <option value="employed">재직자</option>
          </select>
        </label>
        <label class="field">연소득 구간
          <select name="income" id="income"><option value="">모르겠어요</option></select>
        </label>
        <label class="field">부모님과 따로 사는 독립 가구인가요?
          <select name="household">
            <option value="">모르겠어요</option>
            <option value="yes">네, 따로 살아요</option>
            <option value="no">아니요, 함께 살아요</option>
          </select>
        </label>
        <div class="actions">
          <button type="button" data-go="1">이전</button>
          <button type="submit" class="primary">혜택 확인하기</button>
        </div>
      </div>

      <div data-step="3" hidden>
        <h1>조건별로 확인했어요</h1>
        <p class="muted" id="card-summary"></p>
        <p class="legend">✅ 충족 · ❌ 미충족 · ❓ 확인 필요</p>
        <div id="cards"></div>
        <div class="actions">
          <button type="button" data-go="2">이전</button>
          <button type="submit" class="primary">몇 개월 빨라지는지 보기</button>
        </div>
      </div>

      <div data-step="4" hidden>
        <h1>목표까지 걸리는 시간 <span class="estimate">추정치</span></h1>
        <div id="headline" class="result" aria-live="polite"></div>
        <div class="chart-card">
          <div class="chart-legend">
            <span><i class="plus"></i>선택한 혜택</span>
            <span><i class="base"></i>혜택 없이</span>
          </div>
          <div id="chart"></div>
          <details><summary>표로 보기</summary><table id="table"></table></details>
        </div>
        <h2>혜택 켜기 / 끄기</h2>
        <div id="toggles"></div>
        <div class="assume">
          <h2>계산 가정</h2>
          <ul id="assumptions"></ul>
        </div>
        <div class="actions">
          <button type="button" data-go="3">이전</button>
          <button type="button" data-go="1">목표 바꾸기</button>
        </div>
      </div>
    </form>
  </section>

  <section data-view="calendar" id="view-calendar" hidden>
    <h1>청년 혜택 캘린더</h1>
    <p class="muted">준비 중이에요.</p>
  </section>
</main>

</body>
</html>
